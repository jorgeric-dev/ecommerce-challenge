<mat-toolbar class="shell__toolbar">
  <a class="shell__brand" routerLink="/shop">
    <mat-icon>shopping_bag</mat-icon>
    <span>ECommerce</span>
  </a>

  <nav class="shell__nav" aria-label="Main navigation">
    @for (link of links; track link.path) {
      <a matButton routerLinkActive="shell__link--active" [routerLink]="link.path">
        <mat-icon>{{ link.icon }}</mat-icon>
        <span class="shell__link-label">{{ link.label }}</span>
      </a>
    }
  </nav>

  <a
    matIconButton
    routerLink="/shop/cart"
    matTooltip="Shopping cart"
    aria-label="Shopping cart"
    [matBadge]="cart.itemCount()"
    [matBadgeHidden]="cart.isEmpty()"
    matBadgeColor="accent"
  >
    <mat-icon>shopping_cart</mat-icon>
  </a>
</mat-toolbar>

<main class="shell__content">
  <router-outlet />
</main>
